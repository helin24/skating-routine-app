name: skating_routine_app
description: "A Flutter app to help figure skaters build well-balanced routines."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0-268.0.dev

dependencies:
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  flutter:
    sdk: flutter
  path: ^1.9.1
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  sqflite: ^2.4.2
  cloud_firestore: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6
  mockito: ^5.5.1
  build_runner: ^2.9.0

flutter:
  uses-material-design: true
